name: Deploy to VPS CloudOnFire

on:
  push:
    branches: 
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: appleboy/ssh-agent@v1.0.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/github-actions-demo1
            git pull origin main
            docker-compose up -d --build